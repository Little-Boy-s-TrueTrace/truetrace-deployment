limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
limit_req_status 429;

resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_client {
    zone web_client 64k;
    server web-client:3000 resolve;
}

upstream bank_backend {
    zone bank_backend 64k;
    server backend:8080 resolve;
}

upstream dashboard_api {
    zone dashboard_api 64k;
    server dashboard-backend:8082 resolve;
}

upstream dashboard_ui {
    zone dashboard_ui 64k;
    server dashboard-frontend:3001 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    server_tokens off;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file upload size (KYC images)
    client_max_body_size 50M;

    # Access / Error Logs
    access_log /var/log/nginx/truetrace_access.log;
    error_log /var/log/nginx/truetrace_error.log warn;

    # ============================================
    # 1. Next.js Web Portal (Customer-facing)
    # ============================================
    location / {
        proxy_pass http://web_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 2. Banking + AML REST API (Spring Boot)
    # ============================================
    location /api-bank/ {
        proxy_pass http://bank_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Rate limiting on auth endpoints
    location /api-bank/api/auth/ {
        limit_req zone=login_limit burst=30 nodelay;
        proxy_pass http://bank_backend/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 3. TrueTrace Dashboard API (Go Backend)
    # ============================================
    location /api/ {
        proxy_pass http://dashboard_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Dashboard auth endpoint with rate limiting
    location /api/auth/ {
        limit_req zone=login_limit burst=30 nodelay;
        proxy_pass http://dashboard_api/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 4. TrueTrace Compliance Dashboard Frontend (React/Vite)
    # ============================================
    location = /monitor {
        return 301 /monitor/;
    }

    location /monitor/ {
        proxy_pass http://dashboard_ui/monitor/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
