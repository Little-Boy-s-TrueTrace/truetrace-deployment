# Default values for truetrace-platform.
# This is a YAML-formatted file.

# Choose environment: "local" (deploy DBs in K8s) or "aws" (use managed cloud DBs)
environment: "local"

# Common configuration secrets
secrets:
  postgresPassword: "postgres-prod-secret-1234"
  jwtSecret: "truetrace-jwt-secure-signing-key-high-entropy-12345"
  truetraceSecuritySyncToken: "truetrace-sync-token-9876-xyz"
  dashscopeApiKey: "change-me-or-use-external-secret"

# AWS Configuration (Only used when environment is "aws")
aws:
  rdsEndpoint: "truetrace-rds-postgres.c123456789.us-east-1.rds.amazonaws.com"
  mskBrokers: "b-1.truetracemsk.us-east-1.kafka.amazonaws.com:9092,b-2.truetracemsk.us-east-1.kafka.amazonaws.com:9092,b-3.truetracemsk.us-east-1.kafka.amazonaws.com:9092"
  elasticacheEndpoint: "truetrace-cache.c123456.use1.cache.amazonaws.com"
  postgresDb: "truetrace"

# Ingress & Gateway configuration
gateway:
  type: NodePort # NodePort for local desktop, LoadBalancer for AWS
  nodePort: 30080

# Microservices Config
beBackend:
  replicaCount: 1
  image: truetrace-be-backend:latest
  imagePullPolicy: Never
  port: 8080

feWeb:
  replicaCount: 1
  image: truetrace-fe-web:latest
  imagePullPolicy: Never
  port: 3000

dashboardBackend:
  replicaCount: 1
  image: truetrace-dashboard-backend:latest
  imagePullPolicy: Never
  port: 8082

dashboardFrontend:
  replicaCount: 1
  image: truetrace-dashboard-frontend:latest
  imagePullPolicy: Never
  port: 3001

agentEngine:
  replicaCount: 1
  image: truetrace-agent-engine:latest
  imagePullPolicy: Never
  visionProvider: demo
  visionEndpoint: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  visionModel: qwen-vl-plus
  llmProvider: demo
  llmEndpoint: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  llmModel: qwen-plus

sharedLogs:
  accessMode: ReadWriteOnce
  size: 1Gi

fluentBit:
  image: fluent/fluent-bit:3.0
  imagePullPolicy: IfNotPresent
  metricsPort: 2020
  stateAccessMode: ReadWriteOnce
  stateSize: 1Gi
