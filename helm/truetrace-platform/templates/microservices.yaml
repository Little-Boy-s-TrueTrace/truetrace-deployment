apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
spec:
  selector:
    app: dashboard-backend
  ports:
    - port: {{ .Values.dashboardBackend.port }}
      targetPort: {{ .Values.dashboardBackend.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
spec:
  replicas: {{ .Values.dashboardBackend.replicaCount }}
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
        - name: dashboard-backend
          image: {{ .Values.dashboardBackend.image }}
          imagePullPolicy: {{ .Values.dashboardBackend.imagePullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truetrace-secrets
                  key: postgres-password
            {{- if eq .Values.environment "aws" }}
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@{{ .Values.aws.rdsEndpoint }}:5432/{{ .Values.aws.postgresDb }}?sslmode=require"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.aws.mskBrokers | quote }}
            {{- else }}
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/truetrace?sslmode=disable"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
            {{- end }}
            - name: TRUETRACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: truetrace-secrets
                  key: truetrace-security-sync-token
            - name: BANK_BACKEND_URL
              value: "http://be-backend:8080"
          ports:
            - containerPort: {{ .Values.dashboardBackend.port }}
---
