services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: truetrace-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truetrace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - truetrace-network

  # ============================================
  # Redis (Agent State Management & Caching)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: truetrace-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - truetrace-network

  # ============================================
  # Apache Kafka KRaft (Single Node - Dev Mode)
  # ============================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: truetrace-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    expose:
      - "29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-TrueTraceKafkaCluster001}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - truetrace-network

  # ============================================
  # Kafka Topic Provisioner (One-shot)
  # ============================================
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: truetrace-kafka-init
    command: >
      bash -c '
        echo "Waiting for Kafka to be ready..."
        sleep 5
        KAFKA_BIN="/opt/kafka/bin"
        BOOTSTRAP="kafka:29092"

        TOPICS=(
          "truetrace.kyc.submissions"
          "truetrace.transactions"
          "truetrace.findings.deepfake"
          "truetrace.findings.money_trail"
          "truetrace.reports.str"
          "truetrace.alerts"
        )

        for TOPIC in "$${TOPICS[@]}"; do
          echo "Creating topic: $$TOPIC"
          $$KAFKA_BIN/kafka-topics.sh --create \
            --bootstrap-server $$BOOTSTRAP \
            --topic $$TOPIC \
            --partitions 3 \
            --replication-factor 1 \
            --if-not-exists
        done

        echo "All TrueTrace Kafka topics created successfully!"
      '
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - truetrace-network

  # ============================================
  # Kafka UI (Kafdrop) - Message Visualization
  # ============================================
  kafka-ui:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: truetrace-kafka-ui
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - truetrace-network

  # ============================================
  # TrueTrace Backend (Spring Boot Banking + AML API)
  # ============================================
  backend:
    build:
      context: ../truetrace-backend
      dockerfile: Dockerfile
    container_name: truetrace-backend
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-truetrace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_MAX_MESSAGE_BYTES: 10485760
      JWT_SECRET: ${JWT_SECRET:-truetrace-jwt-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      TRUETRACE_SECURITY_SYNC_TOKEN: ${TRUETRACE_SECURITY_SYNC_TOKEN:-change-me-internal-service-token}
      TRUETRACE_DEMO_SEED_ENABLED: "true"
      TRUETRACE_REGISTRATION_INITIAL_BALANCE: ${DEMO_INITIAL_BALANCE:-1000000000}
      TRUETRACE_KYC_REQUIRED_FOR_TRANSFERS: "true"
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - truetrace-network

  # ============================================
  # TrueTrace Agent Engine (Multi-Agent Orchestrator)
  # ============================================
  agent-engine:
    build:
      context: ../truetrace-agent-engine
      dockerfile: Dockerfile
    container_name: truetrace-agent-engine
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_GROUP_ID: truetrace-engine
      KAFKA_MAX_MESSAGE_BYTES: 10485760
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-truetrace}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Vision API (deterministic demo mode by default)
      VISION_API_PROVIDER: ${VISION_API_PROVIDER:-demo}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_API_ENDPOINT: ${VISION_API_ENDPOINT:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen-vl-plus}
      IDENTITY_REGISTRY_ENDPOINT: ${IDENTITY_REGISTRY_ENDPOINT:-}
      IDENTITY_REGISTRY_API_KEY: ${IDENTITY_REGISTRY_API_KEY:-}
      # LLM for report generation
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      # Agent thresholds (demo-friendly: lower for live demonstration)
      MONEY_TRAIL_FREEZE_THRESHOLD: ${MONEY_TRAIL_FREEZE_THRESHOLD:-9.5}
      MONEY_TRAIL_WINDOW_SECONDS: ${MONEY_TRAIL_WINDOW_SECONDS:-3600}
      FAN_OUT_MIN_TARGETS: ${FAN_OUT_MIN_TARGETS:-3}
      RAPID_MOVEMENT_MIN_INFLOW_VND: ${RAPID_MOVEMENT_MIN_INFLOW_VND:-5000000}
      RAPID_MOVEMENT_RATIO: ${RAPID_MOVEMENT_RATIO:-0.80}
      STRUCTURING_THRESHOLD_VND: ${STRUCTURING_THRESHOLD_VND:-500000}
      TRUETRACE_SECURITY_SYNC_TOKEN: ${TRUETRACE_SECURITY_SYNC_TOKEN:-change-me-internal-service-token}
      TRUETRACE_ENV: demo
      # Agent prompt directories
      AGENT_DEEPFAKE_DIR: /agents/deepfake-inspector
      AGENT_MONEY_TRAIL_DIR: /agents/money-trail
      AGENT_AML_REPORTER_DIR: /agents/aml-reporter
    volumes:
      - ../agent-deepfake-inspector:/agents/deepfake-inspector:ro
      - ../agent-money-trail:/agents/money-trail:ro
      - ../agent-aml-reporter:/agents/aml-reporter:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - truetrace-network

  # ============================================
  # TrueTrace Dashboard Backend (Go API)
  # ============================================
  dashboard-backend:
    build:
      context: ../truetrace-dashboard
      dockerfile: Dockerfile
    container_name: truetrace-dashboard-backend
    expose:
      - "8082"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-truetrace}?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BACKEND_URL: http://backend:8080
      TRUETRACE_SECURITY_SYNC_TOKEN: ${TRUETRACE_SECURITY_SYNC_TOKEN:-change-me-internal-service-token}
      TRUETRACE_DASHBOARD_OPERATORS: ${TRUETRACE_DASHBOARD_OPERATORS:-10001:admin,10002:sarah,10003:alex}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - truetrace-network

  # ============================================
  # TrueTrace Dashboard Frontend (React/Vite)
  # ============================================
  dashboard-frontend:
    build:
      context: ../truetrace-dashboard/frontend
      dockerfile: Dockerfile
    container_name: truetrace-dashboard-frontend
    expose:
      - "3001"
    depends_on:
      dashboard-backend:
        condition: service_healthy
    networks:
      - truetrace-network

  # ============================================
  # TrueTrace Web Client (Next.js Customer Portal)
  # ============================================
  web-client:
    build:
      context: ../truetrace-web-client
      dockerfile: Dockerfile
    container_name: truetrace-web-client
    expose:
      - "3000"
    environment:
      BE_BACKEND_URL: http://backend:8080
      DASHBOARD_BACKEND_URL: http://dashboard-backend:8082
      DASHBOARD_FRONTEND_URL: http://dashboard-frontend:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - truetrace-network

  # ============================================
  # Nginx API Gateway & Reverse Proxy (Entrypoint)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: truetrace-nginx-gateway
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-client:
        condition: service_started
      backend:
        condition: service_healthy
      dashboard-backend:
        condition: service_healthy
      dashboard-frontend:
        condition: service_started
    networks:
      - truetrace-network

# ============================================
# Named Volumes
# ============================================
volumes:
  evidence_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  truetrace-network:
    driver: bridge
