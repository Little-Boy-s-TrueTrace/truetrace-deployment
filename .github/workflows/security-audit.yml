name: Security & Compliance Audit Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  deployment-audits:
    name: Run Infrastructure & Deployment Audits
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Kubernetes CLI (kubectl)
      uses: azure/setup-kubectl@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Copy Env Template
      run: cp .env.example .env

    - name: Validate Docker Compose Configuration
      run: docker compose config

    - name: Validate Kubernetes Kustomize Overlays
      run: |
        kubectl kustomize kubernetes/overlays/aws > /dev/null
        kubectl kustomize kubernetes/overlays/local > /dev/null
        echo "Kustomize AWS and local overlays validated successfully!"

    - name: Lint Helm Chart
      run: |
        helm lint helm/truetrace-platform
        echo "Helm chart validated successfully!"
