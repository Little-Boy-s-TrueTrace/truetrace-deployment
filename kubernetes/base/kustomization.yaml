apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - metrics-server-insecure.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - microservices.yaml
  - hpa.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: fluent-bit-config
    files:
      - fluent-bit.conf=configs/fluent-bit.conf
      - parsers.conf=configs/parsers.conf
      - filter_threats.lua=configs/filter_threats.lua
  - name: nginx-gateway-config
    files:
      - default.conf=configs/default.conf
