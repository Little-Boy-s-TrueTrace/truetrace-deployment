apiVersion: v1
kind: Service
metadata:
  name: agent-engine
spec:
  selector:
    app: agent-engine
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-engine
  template:
    metadata:
      labels:
        app: agent-engine
    spec:
      containers:
      - name: agent-engine
        image: truetrace-agent-engine:latest
        imagePullPolicy: Never
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka-1:29092,kafka-2:29092,kafka-3:29092
        - name: KAFKA_GROUP_ID
          value: truetrace-engine
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: BACKEND_URL
          value: http://be-backend:8080
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: truetrace
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: truetrace-secrets
              key: postgres-password
        - name: VISION_API_PROVIDER
          value: mock
        - name: LLM_PROVIDER
          value: mock
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
spec:
  replicas: 5
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.0
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-1:29092,kafka-2:29092,kafka-3:29092
        ports:
        - containerPort: 2020
          name: http-metrics
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/etc
        - name: shared-logs
          mountPath: /var/log/shared
        - name: fluent-bit-state
          mountPath: /var/lib/fluent-bit
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http-metrics
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http-metrics
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: fluent-bit-config
      - name: shared-logs
        persistentVolumeClaim:
          claimName: shared-logs
      - name: fluent-bit-state
        persistentVolumeClaim:
          claimName: fluent-bit-state
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: nginx-gateway
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx-gateway
        image: nginx:alpine
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: htpasswd
          mountPath: /etc/nginx/.htpasswd
          subPath: .htpasswd
        - name: shared-logs
          mountPath: /var/log/nginx
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-gateway-config
      - name: htpasswd
        secret:
          secretName: truetrace-secrets
          items:
          - key: htpasswd
            path: .htpasswd
      - name: shared-logs
        persistentVolumeClaim:
          claimName: shared-logs
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 5
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: obsidiandynamics/kafdrop:4.0.2
        env:
        - name: KAFKA_BROKERCONNECT
          value: kafka-1:29092,kafka-2:29092,kafka-3:29092
        - name: JVM_OPTS
          value: -Xms32M -Xmx64M
        ports:
        - containerPort: 9000
