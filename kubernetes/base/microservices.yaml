---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
spec:
  selector:
    app: dashboard-backend
  ports:
  - port: 8082
    targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
      - name: dashboard-backend
        image: truetrace-bank-deployment-dashboard-backend:latest
        imagePullPolicy: Never
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: truetrace-secrets
              key: postgres-password
        - name: DATABASE_URL
          value: postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/truetrace?sslmode=disable
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-1:29092,kafka-2:29092,kafka-3:29092
        - name: TRUETRACE_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: truetrace-secrets
              key: truetrace-security-sync-token
        - name: BANK_BACKEND_URL
          value: http://be-backend:8080
        ports:
        - containerPort: 8082
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
