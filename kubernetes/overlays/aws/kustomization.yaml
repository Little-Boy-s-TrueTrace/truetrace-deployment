apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: aws-patches.yaml
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: kafka
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-hl
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: kafka-hl
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: kafka-1
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: kafka-2
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: kafka-3

configMapGenerator:
  - name: aws-config
    literals:
      - AWS_RDS_ENDPOINT=truetrace-rds-postgres.c123456789.us-east-1.rds.amazonaws.com
      - AWS_MSK_BROKERS=b-1.truetracemsk.us-east-1.kafka.amazonaws.com:9092,b-2.truetracemsk.us-east-1.kafka.amazonaws.com:9092,b-3.truetracemsk.us-east-1.kafka.amazonaws.com:9092
      - AWS_ELASTICACHE_ENDPOINT=truetrace-cache.c123456.use1.cache.amazonaws.com
      - POSTGRES_DB=truetrace
      - TRUETRACE_ALLOWED_ORIGINS=https://REPLACE_WITH_BANK_DOMAIN
      - IDENTITY_REGISTRY_ENDPOINT=https://REPLACE_WITH_IDENTITY_REGISTRY

generatorOptions:
  disableNameSuffixHash: true
