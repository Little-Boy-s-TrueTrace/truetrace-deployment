apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

secretGenerator:
  - name: truetrace-secrets
    behavior: create
    files:
      - htpasswd=secrets/.htpasswd
    literals:
      - postgres-password=local-demo-postgres-only
      - jwt-secret=local-demo-jwt-signing-key-not-for-production
      - truetrace-security-sync-token=local-demo-internal-token-not-for-production
      - dashscope-api-key=local-demo-no-external-key
      - llm-provider=demo

generatorOptions:
  disableNameSuffixHash: true
