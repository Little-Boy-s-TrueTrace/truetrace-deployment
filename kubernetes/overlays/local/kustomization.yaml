apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

secretGenerator:
  - name: truetrace-secrets
    behavior: merge
    literals:
      - postgres-password=postgres-prod-secret-1234
      - jwt-secret=truetrace-jwt-secure-signing-key-high-entropy-12345
      - truetrace-security-sync-token=truetrace-sync-token-9876-xyz
      - dashscope-api-key=change-me-or-use-demo-mode
      - llm-provider=demo

generatorOptions:
  disableNameSuffixHash: true
